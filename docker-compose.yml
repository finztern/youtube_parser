services:
  youtube-parser:
    build: .
    env_file: .env
    cpus: ${CPU_LIMIT:-3}   # hard CPU cap of the container (cores)
    extra_hosts:
      - "host.docker.internal:host-gateway"   # STORE_ENDPOINT on the host: http://host.docker.internal:PORT/path
    volumes:
      - ./config.yaml:/app/config.yaml:ro   # hot reload: edit in place, no rebuild/restart
    ports:
      - "${DASH_PORT:-8090}:${DASH_PORT:-8090}"   # dashboard
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
