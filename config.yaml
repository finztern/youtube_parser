youtube:
  workers: 100
  hot_interval: 30          # seconds between polls of one hot video
  cold_hours: 6             # a video with no fresh comments, or whose comments the network already knows, is not polled for this long
  min_new_ratio: 0.1        # ...known = share of NEW comments below this after 3 url-checks
  hot_min_gain: 1.0         # video stays hot while it gives >= this many new comments per poll
  explore_share: 0.7        # max share of explore polls; the real share adapts to fresh-per-MB of explore vs hot (floor: explore_min)
  explore_min: 0.2
  related_max_age_hours: 36 # related videos older than this are not explored (video age is read from the watch response)
  explore_max: 3000         # bounded queue of related videos (oldest dropped); new uploads from seed channels go first
  max_hot_videos: 2000
  max_videos: 20000
  max_pages: 3
  hot_max_pages: 2          # hot videos: page 2 only if new >= hot_page_gain of page 1
  hot_page_gain: 0.8
  max_age_hours: 23         # only seconds/minutes/hours ages are accepted
  target_rate: 50           # unique comments/s (after url-check) sent to the collector; 0 = unlimited. Hot reload
  buffer_size: 2000         # soft cap of queued items (check_q + send_q); polling pauses above it. Hot reload
  send_queue_limit: 500    # max items waiting in send_q; above it url-check workers pause (nothing dropped). Hot reload
  batch_size: 50            # items per POST to STORE_ENDPOINT (30-100)
  url_check_attempts: 2        # retry through another node when a check fails
  url_check_batch: 200      # urls per url-check request (100-200)
  url_check_workers: 8
  seen_ttl_hours: 72
  parent_toplevel_mode: self   # self | null
  exact_time_keys: []       # fill after tools/yt_time_probe.py finds an absolute timestamp key
  probe_video: dQw4w9WgXcQ
  reseed_minutes: 5         # re-read channel RSS feeds for new uploads; 0 = off. Hot reload
  seed_channels:
    - UCX6OQ3DkcsbYNE6H8uQQuVA
    - UCq-Fj5jknLsUf-MWSy4_brA
    - UC-lHJZR3Gqxm24_Vd_AJ5Yw
    - UCJ5v_MCY6GNUBTO8-D3XoAg
    - UCFFbwnve3yF62-tVXkTyHqg
  fallback_videos: [dQw4w9WgXcQ, 9bZkp7q19f0, kJQP7kiw5Fk, JGwWNGJdvx8, RgKAFK5djSk]

vpn:
  sources:
    - https://github.com/Au1rxx/free-vpn-subscriptions/raw/main/output/v2ray-base64.txt
  candidates: 800
  nodes: 250
  keep: 150
  probe_concurrency: 30
  max_latency_seconds: 8.0
  refresh_minutes: 60
  quarantine_seconds: 120
